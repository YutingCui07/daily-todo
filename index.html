<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#eee8ff 0,#f8f5ff 38%,#fbfaff 100%);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.app{display:flex;min-height:100vh}.side{width:246px;padding:30px 18px;background:#ffffffb8;border-right:1px solid var(--line);backdrop-filter:blur(16px);position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;padding:0 12px 30px}.logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#bbaaff,#795bd1);display:grid;place-items:center;color:#fff;font-size:21px;box-shadow:0 8px 20px #8469d94a}.brand b{display:block;font-size:18px}.brand small{color:var(--muted)}.nav{display:grid;gap:6px}.nav button{padding:12px 14px;text-align:left;background:transparent;color:#6e6681;border-radius:14px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:var(--soft);color:var(--purple);font-weight:700}.side-note{position:absolute;bottom:25px;left:28px;right:28px;color:var(--muted);font-size:12px}.main{max-width:1180px;width:100%;padding:34px 42px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.eyebrow{color:var(--purple);font-weight:700}.top h1{font-size:30px;margin:4px 0}.date{color:var(--muted)}.primary{background:var(--purple);color:#fff;padding:12px 18px;border-radius:14px;box-shadow:0 8px 18px #8065d83b}.ghost{background:var(--soft);color:var(--purple);padding:10px 14px;border-radius:12px}.danger{color:var(--danger);background:#fff0f3;padding:10px 14px;border-radius:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.stat{padding:20px}.stat .label{color:var(--muted);font-size:13px}.stat .num{font-size:28px;font-weight:800;margin:6px 0}.stat .sub{color:var(--muted);font-size:12px}.progress{height:8px;border-radius:99px;background:#eee9f8;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--purple2),var(--purple));border-radius:99px}.layout{display:grid;grid-template-columns:1.35fr .85fr;gap:18px;margin-top:18px}.card{padding:22px}.card h2{font-size:18px;margin:0 0 16px}.quick{display:flex;gap:10px;margin-bottom:16px}.quick input,.search input,.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);background:#fcfbff;border-radius:12px;padding:11px 13px;outline:none}.quick input:focus,.form input:focus,.form textarea:focus{border-color:var(--purple2);box-shadow:0 0 0 3px #a793ee22}.task{display:flex;gap:12px;align-items:flex-start;padding:15px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0}.check{width:20px;height:20px;border:2px solid #c9bde9;border-radius:7px;background:#fff;flex:none}.check.done{background:var(--purple);border-color:var(--purple);color:#fff}.task-main{flex:1}.task-title{font-weight:700}.done .task-title{text-decoration:line-through;color:#aaa2b4}.task-meta{color:var(--muted);font-size:12px;margin-top:3px}.tag{display:inline-block;background:var(--soft);color:var(--purple);border-radius:20px;padding:2px 8px;margin:5px 4px 0 0;font-size:11px}.priority{font-size:11px;padding:3px 8px;border-radius:20px;background:#fff2d9;color:#bd7a21}.priority.high{background:#fff0f3;color:var(--danger)}.task-actions{display:flex;gap:5px}.icon{background:transparent;color:#a69bb6;padding:5px}.empty{padding:30px;text-align:center;color:var(--muted)}.list-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--line)}.list-row:first-of-type{border-top:0}.muted{color:var(--muted)}.section{display:none}.section.active{display:block}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:16px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select,.filters input{border:1px solid var(--line);padding:9px 11px;border-radius:11px;background:#fff}.form{display:grid;gap:12px}.form label{font-size:13px;color:#6e6681;font-weight:700}.form textarea{min-height:90px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal{position:fixed;inset:0;background:#261d3b66;display:none;place-items:center;padding:20px;z-index:5}.modal.open{display:grid}.modal-box{background:#fff;border-radius:24px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h2{margin:0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:110px;border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}.day.today{border:2px solid var(--purple)}.day b{font-size:13px}.dot{height:6px;border-radius:99px;background:var(--purple2);margin-top:8px}.summary{background:linear-gradient(135deg,#f0ebff,#fff);border:1px solid #ded2ff;border-radius:18px;padding:18px;white-space:pre-wrap}.toast{position:fixed;bottom:24px;right:24px;background:#31264b;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.2s;z-index:9}.toast.show{opacity:1;transform:none}.mobile-nav{display:none}
@media(max-width:850px){.side{display:none}.main{padding:22px 16px 90px}.grid4{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fffefedb;border-top:1px solid var(--line);z-index:4;justify-content:space-around;padding:8px}.mobile-nav button{background:transparent;color:var(--muted);font-size:11px}.mobile-nav button.active{color:var(--purple);font-weight:700}.top h1{font-size:24px}.form-grid{grid-template-columns:1fr}.calendar{gap:4px}.day{min-height:75px;padding:6px;font-size:11px}}
.check{display:grid;place-items:center;padding:0;line-height:1;font-size:13px;margin-top:1px}.quick .details-add{background:#f0ebff;color:#8065d8;padding:12px 14px;border-radius:14px;white-space:nowrap}

<style>.yuplan-art-card{overflow:hidden;position:relative}.yuplan-art-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 14px}.yuplan-art-grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;display:block}.yuplan-art-note{position:relative;z-index:1}@media(max-width:850px){.yuplan-art-grid{gap:5px}.yuplan-art-grid img{border-radius:9px}}</style>
<style>.modal-box{margin:auto;width:min(560px,calc(100vw - 32px))}.reminder-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#6e6681;font-weight:700}.reminder-row input{width:18px;height:18px;margin:0}.reminder-row select{width:auto;min-width:150px;border:1px solid var(--line);background:#fcfbff;border-radius:12px;padding:10px 12px}</style>

<body>
<div class="app"><aside class="side"><div class="brand"><div class="logo">✦</div><div><b>YuPlan</b><small>专注每一天</small></div></div><nav class="nav" id="nav"></nav><div class="side-note">数据只保存在本机浏览器<br>不登录、不上传、不依赖插件</div></aside>
<main class="main"><div class="top"><div><div class="eyebrow">个人效率空间</div><h1 id="greeting">下午好，今天也要元气满满</h1><div class="date" id="todayLabel"></div></div><button class="primary" onclick="openModal()">＋ 新建任务</button></div>
<section id="today" class="section active"></section><section id="tasks" class="section"></section><section id="calendar" class="section"></section><section id="reminders" class="section"></section><section id="summary" class="section"></section><section id="settings" class="section"></section></main></div>
<div class="mobile-nav" id="mobileNav"></div><div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle">新建任务</h2><button class="icon" onclick="closeModal()">✕</button></div><form class="form" id="taskForm"><label>任务标题<input id="fTitle" required placeholder="例如：完成周报初稿"></label><label>描述<textarea id="fDesc" placeholder="补充说明（可选）"></textarea></label><div class="form-grid"><label>日期<input id="fDate" type="date" required></label><label>时间<input id="fTime" type="time"></label><label>优先级<select id="fPriority"><option value="high">高优先</option><option value="medium" selected>中优先</option><option value="low">低优先</option></select></label><label>预计时长（分钟）<input id="fDuration" type="number" min="5" value="30"></label><label>标签<input id="fTags" placeholder="工作, 写作"></label><label>重复<select id="fRepeat"><option>不重复</option><option>每天</option><option>工作日</option><option>每周</option></select></label></div><div class="reminder-row"><input id="fReminder" type="checkbox"><span>提前提醒我</span><select id="fReminderBefore"><option value="5">提前 5 分钟</option><option value="10" selected>提前 10 分钟</option><option value="15">提前 15 分钟</option><option value="30">提前 30 分钟</option><option value="60">提前 1 小时</option></select></div><div style="display:flex;justify-content:flex-end;gap:10px"><button type="button" class="ghost" onclick="closeModal()">取消</button><button class="primary">保存任务</button></div></form></div></div><div class="toast" id="toast"></div>

function taskHtml(t){return `<div class="task ${t.done?'done':''}"><button class="check ${t.done?'done':''}" onclick="toggle('${t.id}')">${t.done?'✓':''}</button><div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="task-meta">${t.time||'未安排时间'} · ${t.duration||30}分钟 ${t.repeat&&t.repeat!=='不重复'?'· '+t.repeat:''}</div>${t.priority?`<span class="priority ${t.priority==='high'?'high':''}">${t.priority==='high'?'高优先':t.priority==='medium'?'中优先':'低优先'}</span>`:''}${(t.tags||[]).map(x=>`<span class="tag">#${esc(x)}</span>`).join('')}</div><div class="task-actions"><button class="icon" onclick="editTask('${t.id}')">✎</button><button class="icon" onclick="removeTask('${t.id}')">⌫</button></div></div>`}
function stats(){let ts=state.tasks.filter(t=>t.date===today()),done=ts.filter(t=>t.done).length,total=ts.length,mins=ts.filter(t=>t.done).reduce((a,t)=>a+(+t.duration||0),0);return {ts,done,total,mins,pct:total?Math.round(done/total*100):0}}
function renderToday(){let s=stats(),pending=s.ts.filter(t=>!t.done),finished=s.ts.filter(t=>t.done);document.getElementById('today').innerHTML=`<div class="grid4"><div class="stat"><div class="label">今日完成率</div><div class="num">${s.pct}%</div><div class="progress"><i style="width:${s.pct}%"></i></div></div><div class="stat"><div class="label">已完成 / 总任务</div><div class="num">${s.done} / ${s.total}</div><div class="sub">${pending.length?'还有 '+pending.length+' 项待处理':'今天全部完成'}</div></div><div class="stat"><div class="label">今日专注时长</div><div class="num">${s.mins}<small style="font-size:14px"> 分钟</small></div><div class="sub">已完成任务累计</div></div><div class="stat"><div class="label">下班提醒</div><div class="num">${state.settings.workEnd}</div><div class="sub">${state.settings.notify?'浏览器提醒已开启':'提醒未开启'}</div></div></div><div class="layout"><div class="card"><h2>今天要做什么？</h2><div class="quick"><input id="quickInput" placeholder="快速添加今日任务，回车即可保存" onkeydown="if(event.key==='Enter'){quickAdd();event.preventDefault()}"><button class="primary" onclick="quickAdd()">添加</button></div><h2 style="margin-top:20px">进行中（${pending.length}）</h2>${pending.length?pending.map(taskHtml).join(''):'<div class="empty">今天没有待办，给自己放个小假吧 ✨</div>'}<h2 style="margin-top:24px">已完成（${finished.length}）</h2>${finished.length?finished.map(taskHtml).join(''):'<div class="empty">完成一项，成就感就多一分</div>'}</div><div class="card yuplan-art-card"><div class="yuplan-art-grid">${YUPLAN_ARTS.map((src,i)=>`<img src="${src}" alt="YuPlan 贴纸 ${i+1}">`).join("")}</div><h2>今日小提示</h2><div class="summary yuplan-art-note">把最重要的一件事放在精力最好的时段。\n\n下班前打开「日结」，系统会自动整理：\n• 做完了什么\n• 哪些事情没做完\n• 明天最重要的三件事</div><button class="ghost" style="margin-top:14px" onclick="navTo('summary')">去写今日总结 →</button></div></div>`}
function renderTasks(){let ts=[...state.tasks],q=document.getElementById('taskQ')?.value||'',filter=document.getElementById('taskFilter')?.value||'all';if(q)ts=ts.filter(t=>(t.title+t.desc+(t.tags||[]).join('')).toLowerCase().includes(q.toLowerCase()));if(filter!=='all')ts=ts.filter(t=>filter==='done'?t.done:filter==='todo'?!t.done:t.priority===filter);document.getElementById('tasks').innerHTML=`<div class="card"><div class="toolbar"><div><h2 style="margin:0">全部任务</h2><div class="muted">${state.tasks.length} 个任务 · 本地自动保存</div></div><button class="primary" onclick="openModal()">＋ 新建任务</button></div><div class="filters"><input id="taskQ" placeholder="搜索任务、标签" value="${esc(q)}" oninput="renderTasks()"><select id="taskFilter" onchange="renderTasks()"><option value="all">全部状态</option><option value="todo">未完成</option><option value="done">已完成</option><option value="high">高优先</option><option value="medium">中优先</option><option value="low">低优先</option></select></div><div style="margin-top:12px">${ts.length?ts.sort((a,b)=>a.date.localeCompare(b.date)).map(t=>`<div class="list-row"><div style="flex:1">${taskHtml(t)}</div></div>`).join(''):'<div class="empty">没有找到匹配的任务</div>'}</div></div>`}
function renderCalendar(){let d=new Date(),start=new Date(d);start.setDate(d.getDate()-((d.getDay()+6)%7));let days=[];for(let i=0;i<7;i++){let x=new Date(start);x.setDate(start.getDate()+i);let ds=x.toISOString().slice(0,10),ts=state.tasks.filter(t=>t.date===ds);days.push(`<div class="day ${ds===today()?'today':''}"><b>${['一','二','三','四','五','六','日'][i]} ${x.getDate()}</b>${ts.map(t=>`<div class="dot" title="${esc(t.title)}" style="opacity:${t.done?.35:1}"></div>`).join('')}<div class="muted" style="margin-top:6px">${ts.length?ts.length+' 项':'空闲'}</div></div>`)}document.getElementById('calendar').innerHTML=`<div class="card"><div class="toolbar"><div><h2 style="margin:0">本周计划</h2><div class="muted">点击新建任务可安排到指定日期</div></div><button class="primary" onclick="openModal()">＋ 新建任务</button></div><div class="calendar">${days.join('')}</div></div>`}
function renderReminders(){let now=new Date(),ts=state.tasks.filter(t=>t.reminder&&!t.done),over=ts.filter(t=>new Date(t.date+'T'+(t.time||'23:59'))<now);document.getElementById('reminders').innerHTML=`<div class="layout"><div class="card"><h2>待提醒任务</h2>${ts.length?ts.map(t=>`<div class="list-row"><div><b>${esc(t.title)}</b><div class="muted">${t.date} ${t.time||''}</div></div><button class="ghost" onclick="toggle(${t.id})">完成</button></div>`).join(''):'<div class="empty">暂无待提醒任务</div>'}</div><div class="card"><h2>提醒设置</h2><p class="muted">浏览器提醒只在页面打开时运行；如果要离开网页仍能提醒，可以把任务导出到日历。</p><button class="primary" onclick="enableNotify()">${state.settings.notify?'提醒已开启':'开启浏览器提醒'}</button><button class="ghost" style="margin-left:8px" onclick="exportICS()">导出到日历</button><h2 style="margin-top:25px">逾期任务（${over.length}）</h2>${over.map(t=>`<div class="list-row"><span>${esc(t.title)}</span><span class="priority high">逾期</span></div>`).join('')||'<div class="muted">没有逾期任务，保持得很好。</div>'}</div></div>`}
function summaryText(){let s=stats(),done=s.ts.filter(t=>t.done),no=s.ts.filter(t=>!t.done);return `【YuPlan｜${fmt(today())}】\n\n✅ 今天完成（${done.length}）\n${done.map(t=>'· '+t.title).join('\n')||'· 暂无'}\n\n⏳ 尚未完成（${no.length}）\n${no.map(t=>'· '+t.title).join('\n')||'· 全部完成'}\n\n⏱ 专注时长：${s.mins} 分钟\n\n📝 今日复盘\n${state.review||'（待填写）'}\n\n🎯 明日重点\n${state.tomorrow||'（待填写）'}`}
function renderSummary(){let s=stats();document.getElementById('summary').innerHTML=`<div class="layout"><div class="card"><div class="toolbar"><div><h2 style="margin:0">下班日结</h2><div class="muted">一键整理今天，轻装开始明天</div></div><button class="primary" onclick="copySummary()">复制日结</button></div><div class="summary">${esc(summaryText())}</div><div class="form" style="margin-top:16px"><label>今日复盘<textarea id="review" placeholder="今天做得好的地方、遇到的问题……">${esc(state.review)}</textarea></label><label>明日重点<textarea id="tomorrow" placeholder="明天最重要的三件事……">${esc(state.tomorrow)}</textarea></label><button class="ghost" onclick="saveNotes()">保存复盘</button></div></div><div class="card"><h2>今日回顾</h2><div class="list-row"><span>完成任务</span><b>${s.done} 项</b></div><div class="list-row"><span>未完成任务</span><b>${s.total-s.done} 项</b></div><div class="list-row"><span>专注时长</span><b>${s.mins} 分钟</b></div><button class="ghost" style="margin-top:18px" onclick="mailSummary()">用邮箱发送日结</button></div></div>`}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="card"><h2>设置</h2><div class="form"><label>下班时间<input id="workEnd" type="time" value="${state.settings.workEnd}" onchange="state.settings.workEnd=this.value;save();toast('下班时间已保存')"></label><label><input type="checkbox" ${state.settings.notify?'checked':''} onchange="state.settings.notify=this.checked;save();toast('提醒设置已保存')"> 开启页面内提醒</label><p class="muted">所有任务和复盘都只保存在当前浏览器，不会上传服务器。</p><button class="danger" onclick="clearData()">清空所有本地数据</button></div></div>`}
function render(){renderToday();renderTasks();renderCalendar();renderReminders();renderSummary();renderSettings();document.getElementById('todayLabel').textContent=fmt(today());let h=new Date().getHours();document.getElementById('greeting').textContent=(h<12?'早上好':h<18?'下午好':'晚上好')+'，今天也要元气满满'}
function openModal(id=null){editing=id;document.getElementById('modal').classList.add('open');document.getElementById('modalTitle').textContent=id?'编辑任务':'新建任务';let t=id&&state.tasks.find(x=>String(x.id)===String(id));document.getElementById('fTitle').value=t?.title||'';document.getElementById('fDesc').value=t?.desc||'';document.getElementById('fDate').value=t?.date||today();document.getElementById('fTime').value=t?.time||'';document.getElementById('fPriority').value=t?.priority||'medium';document.getElementById('fDuration').value=t?.duration||30;document.getElementById('fTags').value=(t?.tags||[]).join(', ');document.getElementById('fRepeat').value=t?.repeat||'不重复';document.getElementById('fReminder').checked=!!t?.reminder;document.getElementById('fReminderBefore').value=t?.reminderBefore||10} function closeModal(){document.getElementById('modal').classList.remove('open');editing=null} function editTask(id){openModal(id)} function toggle(id){let t=state.tasks.find(x=>String(x.id)===String(id));t.done=!t.done;save();render();toast(t.done?'已完成，做得漂亮！':'已恢复为待办')} function removeTask(id){if(confirm('确定删除这个任务吗？')){state.tasks=state.tasks.filter(x=>String(x.id)!==String(id));save();render();toast('任务已删除')}} function quickAdd(){let el=document.getElementById('quickInput'),v=el?.value.trim();if(!v)return;state.tasks.unshift({id:Date.now(),title:v,date:today(),priority:'medium',duration:30,tags:[],done:false});save();render();toast('任务已添加')} function saveNotes(){state.review=document.getElementById('review').value;state.tomorrow=document.getElementById('tomorrow').value;save();render();toast('复盘已保存')} function copySummary(){navigator.clipboard?.writeText(summaryText());toast('日结已复制')} function mailSummary(){location.href='mailto:?subject='+encodeURIComponent('今日工作日结 · '+fmt(today()))+'&body='+encodeURIComponent(summaryText())} function reminderBefore(t){return Math.max(0,+t.reminderBefore||10)} function enableNotify(){if('Notification' in window)Notification.requestPermission().then(p=>{state.settings.notify=p==='granted';save();render();toast(p==='granted'?'浏览器提醒已开启':'浏览器未授权提醒')});else toast('当前浏览器不支持通知')} function exportICS(){let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//YuPlan//Planner//CN'];state.tasks.filter(t=>!t.done&&t.date).forEach(t=>{let dt=(t.date.replaceAll('-','')+'T'+(t.time||'0900').replace(':','')+'00');lines.push('BEGIN:VEVENT','UID:'+t.id+'@yuplan','DTSTART:'+dt,'SUMMARY:'+t.title,'DESCRIPTION:'+(t.desc||''),'BEGIN:VALARM','TRIGGER:-PT'+reminderBefore(t)+'M','ACTION:DISPLAY','DESCRIPTION:提醒：'+t.title,'END:VALARM','END:VEVENT')});lines.push('END:VCALENDAR');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'text/calendar'}));a.download='YuPlan.ics';a.click();toast('日历文件已导出')} function clearData(){if(confirm('确定清空所有任务和复盘吗？')){state={tasks:[],review:'',tomorrow:'',settings:{workEnd:'18:00',notify:false}};save();render();toast('本地数据已清空')}}
document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();let t=editing&&state.tasks.find(x=>x.id===editing);let data={id:t?.id||crypto.randomUUID(),title:fTitle.value.trim(),desc:fDesc.value.trim(),date:fDate.value,time:fTime.value,priority:fPriority.value,duration:+fDuration.value||30,tags:fTags.value.split(',').map(x=>x.trim()).filter(Boolean),repeat:fRepeat.value,reminder:fReminder.checked,reminderBefore:+fReminderBefore.value||10,done:t?.done||false};if(t)Object.assign(t,data);else state.tasks.unshift(data);save();closeModal();render();toast(t?'任务已更新':'任务已创建')};renderNav();render();setInterval(()=>{if(state.settings.notify&&Notification.permission==='granted')state.tasks.filter(t=>t.reminder&&!t.done&&t.date===today()&&t.time&&new Date(t.date+'T'+t.time).getTime()-reminderBefore(t)*60000<=Date.now()&&new Date(t.date+'T'+t.time).getTime()>Date.now()-30000).forEach(t=>new Notification('YuPlan提醒',{body:t.title}));},30000);
